apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-example-com
  namespace: edge-gateway
spec:
  secretName: wildcard-example-com
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - example.com
    - "*.example.com"
  privateKey:
    algorithm: ECDSA
    size: 256
