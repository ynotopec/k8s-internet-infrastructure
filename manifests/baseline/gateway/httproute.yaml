apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-frontend
  namespace: edge-gateway
  labels:
    app: edge-gateway
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: https
  hostnames:
    - example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: app.example.svc.cluster.local
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              X-Request-From: gateway
      backendRefs:
        - name: app-frontend
          port: 80
          weight: 90
        - name: app-frontend-v2
          port: 80
          weight: 10
      timeouts:
        request: 30s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: edge-gateway
  labels:
    app: edge-gateway
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: http-redirect
  hostnames:
    - example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
